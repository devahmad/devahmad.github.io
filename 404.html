<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه یافت نشد - 404</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        
        .error-container {
            padding: 40px;
            max-width: 600px;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .error-title {
            font-size: 2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .error-message {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .error-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: white;
            color: #667eea;
        }
        
        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .btn-primary:hover {
            background: #f8fafc;
        }
        
        .btn-secondary:hover {
            background: white;
            color: #667eea;
        }
        
        .error-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }
            
            .error-title {
                font-size: 1.5rem;
            }
            
            .error-message {
                font-size: 1rem;
            }
            
            .error-container {
                padding: 20px;
            }
            
            .error-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 200px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">🤔</div>
        <div class="error-code">404</div>
        <h1 class="error-title">صفحه مورد نظر یافت نشد!</h1>
        <p class="error-message">
            متأسفیم، صفحه‌ای که به دنبال آن هستید وجود ندارد یا ممکن است آدرس آن تغییر کرده باشد.
        </p>
        <div class="error-buttons">
            <a href="/" class="btn btn-primary">
                <span>🏠</span>
                بازگشت به صفحه اصلی
            </a>
            <button onclick="history.back()" class="btn btn-secondary">
                <span>←</span>
                بازگشت به صفحه قبل
            </button>
        </div>
    </div>
    
    <script>
        // Add some interactive effects
        document.addEventListener('mousemove', (e) => {
            const errorCode = document.querySelector('.error-code');
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            errorCode.style.transform = `translate(${x}px, ${y}px)`;
        });
        
        // Language detection and switching
        const userLang = navigator.language || navigator.userLanguage;
        if (userLang.startsWith('en')) {
            document.title = 'Page Not Found - 404';
            document.querySelector('.error-title').textContent = 'Page Not Found!';
            document.querySelector('.error-message').textContent = 
                'Sorry, the page you are looking for does not exist or the address may have changed.';
            document.querySelector('.btn-primary').innerHTML = '<span>🏠</span> Back to Homepage';
            document.querySelector('.btn-secondary').innerHTML = '<span>←</span> Go Back';
        }
    </script>
</body>
</html>
